# Weekly dependency updates; each pull request is verified by the CI workflow
# (lint, build and the Playwright usability tests).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates arrive together in one pull request.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
