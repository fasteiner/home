# Weekly dependency updates; each pull request is verified by the CI workflow
# (lint, build and the Playwright usability tests).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Font Awesome icon packages share their icon types, so they move
      # together, major updates included (the first matching group wins).
      fontawesome:
        patterns: ["@fortawesome/*"]
      # Minor and patch updates arrive together in one pull request.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
