# Weekly dependency updates; each pull request is verified by the CI workflow
# (lint, build and the Playwright usability tests).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Font Awesome icon packages share their icon types, so they move
      # together, major updates included (the first matching group wins).
      fontawesome:
        patterns: ["@fortawesome/*"]
      # Minor and patch updates arrive together in one pull request.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node.js major the site builds and runs on
      # (Node 24 in CI and the README). Major bumps are skipped; 24.x minor and
      # patch updates still arrive. Raise it by hand together with the runtime
      # (see #44).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
